name: Build Debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle-dist
          ln -sf /opt/gradle-dist/gradle-8.7/bin/gradle /usr/local/bin/gradle
          which gradle && gradle --version

      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon --stacktrace > /tmp/build.log 2>&1
          RESULT=$?
          cat /tmp/build.log
          exit $RESULT

      - name: Verify APK structure
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          python3 - <<'EOF'
          import zipfile, os, sys
          f = 'app/build/outputs/apk/debug/app-debug.apk'
          try:
              with zipfile.ZipFile(f) as z:
                  names = z.namelist()
                  assert 'AndroidManifest.xml' in names, 'Missing AndroidManifest.xml'
                  assert any(n.endswith('.dex') for n in names), 'No .dex files'
                  print(f'APK valid: {len(names)} entries, {os.path.getsize(f):,} bytes')
          except Exception as e:
              print(f'APK invalid: {e}')
              sys.exit(1)
          EOF

      - name: Save error log to repo via API
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG_B64=$(tail -300 /tmp/build.log 2>/dev/null | base64 -w 0)
          [ -z "$LOG_B64" ] && LOG_B64=$(echo "empty log" | base64 -w 0)
          EXISTING_SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/contents/ci-build-error.txt?ref=${{ github.ref_name }}" \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print(r.get('sha',''))" 2>/dev/null || echo "")
          if [ -n "$EXISTING_SHA" ]; then
            SHA_FIELD=",\"sha\":\"$EXISTING_SHA\""
          else
            SHA_FIELD=""
          fi
          HTTP=$(curl -s -w "%{http_code}" -o /tmp/api_response.json -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/ci-build-error.txt" \
            -d "{\"message\":\"ci: error log\",\"content\":\"$LOG_B64\",\"branch\":\"${{ github.ref_name }}\"$SHA_FIELD}")
          echo "HTTP status: $HTTP"
          cat /tmp/api_response.json | python3 -c "import sys,json; r=json.load(sys.stdin); print(r.get('message', r.get('content',{}).get('sha','ok')[:8] if isinstance(r.get('content'),dict) else 'ok'))" 2>/dev/null || true

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HUDDLDOverlaySpike-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="debug-${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Debug APK #${{ github.run_number }}" \
            --notes "Branch: \`${{ github.ref_name }}\` · Commit: \`${{ github.sha }}\`" \
            "app/build/outputs/apk/debug/app-debug.apk#app-debug.apk"
