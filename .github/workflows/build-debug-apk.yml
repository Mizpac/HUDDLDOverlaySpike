name: Build Debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle-dist
          ln -sf /opt/gradle-dist/gradle-8.7/bin/gradle /usr/local/bin/gradle
          which gradle && gradle --version

      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon --stacktrace > /tmp/build.log 2>&1
          RESULT=$?
          cat /tmp/build.log
          exit $RESULT

      - name: Stage and verify APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HUDDLDOverlaySpike-debug.apk

          # File exists
          [ -f HUDDLDOverlaySpike-debug.apk ] || { echo "ERROR: file not found"; exit 1; }

          # Filename ends in .apk
          case HUDDLDOverlaySpike-debug.apk in *.apk) ;; *) echo "ERROR: not .apk"; exit 1 ;; esac

          # Valid ZIP/APK structure
          unzip -l HUDDLDOverlaySpike-debug.apk > /tmp/apk-contents.txt
          grep -q AndroidManifest.xml /tmp/apk-contents.txt || { echo "ERROR: AndroidManifest.xml missing from APK"; exit 1; }

          ls -lh HUDDLDOverlaySpike-debug.apk
          echo "APK verified OK"

      - name: Save error log to repo via API
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG_B64=$(tail -300 /tmp/build.log 2>/dev/null | base64 -w 0)
          [ -z "$LOG_B64" ] && LOG_B64=$(echo "empty log" | base64 -w 0)
          EXISTING_SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/contents/ci-build-error.txt?ref=${{ github.ref_name }}" \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print(r.get('sha',''))" 2>/dev/null || echo "")
          if [ -n "$EXISTING_SHA" ]; then
            SHA_FIELD=",\"sha\":\"$EXISTING_SHA\""
          else
            SHA_FIELD=""
          fi
          HTTP=$(curl -s -w "%{http_code}" -o /tmp/api_response.json -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/ci-build-error.txt" \
            -d "{\"message\":\"ci: error log\",\"content\":\"$LOG_B64\",\"branch\":\"${{ github.ref_name }}\"$SHA_FIELD}")
          echo "HTTP status: $HTTP"
          cat /tmp/api_response.json | python3 -c "import sys,json; r=json.load(sys.stdin); print(r.get('message', 'ok'))" 2>/dev/null || true

      - name: Upload raw APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HUDDLDOverlaySpike-debug-apk
          path: HUDDLDOverlaySpike-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish to GitHub Release android-debug-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Remove existing release and tag so this run becomes the new latest
          gh release delete android-debug-latest --yes \
            --repo "${{ github.repository }}" 2>/dev/null || true
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            :refs/tags/android-debug-latest 2>/dev/null || true

          # Create release and attach the raw APK directly
          gh release create android-debug-latest \
            --repo "${{ github.repository }}" \
            --title "Android Debug Latest" \
            --notes "Branch: \`${{ github.ref_name }}\` · Commit: \`${{ github.sha }}\` · Run: #${{ github.run_number }}" \
            --latest \
            HUDDLDOverlaySpike-debug.apk
