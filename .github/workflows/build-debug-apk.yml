name: Build Debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle-dist
          ln -sf /opt/gradle-dist/gradle-8.7/bin/gradle /usr/local/bin/gradle
          which gradle
          gradle --version

      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon --stacktrace > /tmp/build.log 2>&1 || {
            cat /tmp/build.log
            exit 1
          }

      - name: Push build log on failure
        if: failure()
        run: |
          cp /tmp/build.log ci-build-error.txt 2>/dev/null || echo "no log captured" > ci-build-error.txt
          git config user.email "ci@github.com"
          git config user.name "CI"
          git add ci-build-error.txt
          git commit -m "ci: build error log [skip ci]" || true
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }} || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HUDDLDOverlaySpike-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
