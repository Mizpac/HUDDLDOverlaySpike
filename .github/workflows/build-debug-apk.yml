name: Build Debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle-dist
          ln -sf /opt/gradle-dist/gradle-8.7/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Write error log to repo file
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('/tmp/build.log', 'utf8').slice(-6000); } catch(e) { log = 'no log file'; }
            const content = Buffer.from(log).toString('base64');
            const branch = 'claude/minimal-overlay-spike';
            let sha;
            try {
              const r = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path: 'ci-build-error.txt', ref: branch });
              sha = r.data.sha;
            } catch(e) {}
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo,
              path: 'ci-build-error.txt', message: 'ci: build error log',
              content, branch, ...(sha ? { sha } : {})
            });

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HUDDLDOverlaySpike-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
